services:
  - type: web
    name: prophet-hacks-agent
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: CONGRESS_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: MENGYE_SEARCH_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
